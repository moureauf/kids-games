name: PR labels

# Size and tier labels (agent loop trial, Q1). pull_request_target runs this
# workflow and scripts/pr-labels.ts as they are on main, so a PR cannot change
# them. Never check out, install or run PR code here: the PR file list comes
# from the API only. Events from GITHUB_TOKEN start no new runs, so the
# label changes made here do not loop. A label set by hand is put back.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read # check out main (this script only)
  issues: read # the size:* label of the linked issue
  pull-requests: write # read the file list, set the labels

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/pr-labels.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/pr-labels.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
