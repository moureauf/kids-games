name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come with the image, so CI never
    # waits on an apt mirror. Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.65.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Check the image matches @playwright/test
        run: |
          v=$(node -p 'require("@playwright/test/package.json").version')
          if [ "$v" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $v but the CI image is $PLAYWRIGHT_IMAGE_VERSION. Update container.image and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml."
            exit 1
          fi
      - run: npm run e2e
        timeout-minutes: 8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            screenshots/
          retention-days: 14
