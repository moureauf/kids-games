name: Task
description: One small piece of work = one PR
labels: []
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build. Keep it small enough for one session.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check anyone can run (a test, a screenshot, a command).
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [hub, sound-safari, letter-trail, other]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S, M]
    validations:
      required: true
